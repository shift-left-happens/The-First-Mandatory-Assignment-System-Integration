# GraphQL API - Library (Software Integration - First Mandatory Assignment)
#
#   docker compose up --build
#
# The GraphQL endpoint is then available at http://localhost:4000/graphql
#
# The `../database` folder is mounted into the container so this API and the
# other APIs share the same SQLite database file.

services:
  graphql:
    build:
      context: .
    image: library-graphql-api:latest
    container_name: library-graphql-api
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      HOST: "0.0.0.0"
      DB_PATH: /app/database/library.db
    volumes:
      - ../database:/app/database
    restart: unless-stopped
